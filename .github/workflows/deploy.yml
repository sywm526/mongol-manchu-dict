name: Deploy to GitHub Pages

# Pages 现使用「从 main 分支构建」(legacy)，push 会自动发布，无需 Actions 部署。
# 保留此文件仅作手动备用，去掉 push 触发以免每次推送都产生失败记录。
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove .git before packaging
        run: rm -rf .git
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
